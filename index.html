  <script>
    function generateDefaultShareCode() {
      const alpha = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const nums = '0123456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += alpha.charAt(Math.floor(Math.random() * alpha.length));
        code += nums.charAt(Math.floor(Math.random() * nums.length));
      }
      return code;
    }

    function createDefaultMap(id, name) {
      return { id: id || ('map_' + Date.now() + '_' + Math.floor(Math.random()*1000)), name: name || 'マイグルメマップ', stores: [], areas: [], lists: [], areaLists: [], isShared: false, shareCode: '', shareSnapshot: '', shareVersion: 0 };
    }

    function asArray(value) {
      if (Array.isArray(value)) return value;
      if (value && typeof value === 'object') return Object.values(value);
      return [];
    }

    function normalizeMapData() {
      maps = asArray(maps).map(m => ({
        ...m,
        stores: asArray(m.stores),
        areas: asArray(m.areas),
        lists: asArray(m.lists),
        areaLists: asArray(m.areaLists)
      }));
      // 表記変更に合わせて既存データも新名称へ統一。
      maps.forEach(m => (m.stores || []).forEach(s => {
        if (s.form === 'スイーツ') s.form = 'スイーツ系';
        if (Array.isArray(s.options) && s.options.includes('private')) { /* option id remains stable */ }
      }));
    }

    async function loadCurrentUserData() {
      // ログインユーザーのデータはFirebase Realtime Databaseから取得。
      // これでPC・スマホなど端末が変わっても同じ店舗・エリア・リストを利用できる。
      if (currentUser.loggedIn && currentUser.uid) {
        try {
          const snapshot = await readUserDatabase(currentUser.uid);
          const cloudData = snapshot.val();

          if (cloudData) {
            currentUser.name = cloudData.name || currentUser.name || 'ユーザー';
            maps = asArray(cloudData.maps);
            currentMapId = cloudData.currentMapId || (maps[0] ? maps[0].id : '');
          } else {
            // 初回ログイン時：旧localStorageにデータがあればFirebaseへ移行。
            const legacyUser = users[currentUser.uid];
            const legacyMaps = legacyUser && Array.isArray(legacyUser.maps)
              ? legacyUser.maps
              : (JSON.parse(localStorage.getItem(`gourmet_user_maps_${currentUser.uid}`)) || []);

            maps = legacyMaps;
            currentMapId = (legacyUser && legacyUser.currentMapId)
              || localStorage.getItem(`gourmet_user_map_id_${currentUser.uid}`)
              || (maps[0] ? maps[0].id : '');

            if (!maps.length) {
              const defaultMap = createDefaultMap();
              maps = [defaultMap];
              currentMapId = defaultMap.id;
            }

            await saveStorage(false);
          }
        } catch (e) {
          console.error('Firebaseデータ取得失敗:', e);

          // 通信エラー時だけローカルを表示。クラウドを上書きしない。
          const legacyUser = users[currentUser.uid];
          maps = legacyUser && Array.isArray(legacyUser.maps)
            ? legacyUser.maps
            : (JSON.parse(localStorage.getItem(`gourmet_user_maps_${currentUser.uid}`)) || []);
          currentMapId = (legacyUser && legacyUser.currentMapId)
            || localStorage.getItem(`gourmet_user_map_id_${currentUser.uid}`)
            || '';
        }
      } else {
        maps = JSON.parse(localStorage.getItem('gourmet_guest_maps')) || [];
        currentMapId = localStorage.getItem('gourmet_guest_map_id') || '';
      }

      normalizeMapData();

      if (!maps || maps.length === 0) {
        const defaultMap = createDefaultMap();
        maps = [defaultMap];
        currentMapId = defaultMap.id;
      }

      if (!currentMapId || !maps.find(m => m.id === currentMapId)) {
        currentMapId = maps[0].id;
      }

      maps.forEach(m => {
        if (!m.lists) m.lists = [];
        if (!m.areaLists) m.areaLists = [];
        if (!Array.isArray(m.areaLists)) m.areaLists = asArray(m.areaLists);
        (m.stores || []).forEach(st => { if (st.form === 'スイーツ') st.form = 'スイーツ系'; });
        (m.areas || []).forEach(a => { if (!Array.isArray(a.listIds)) a.listIds = []; });
        m.areaLists.forEach(l => { if (!Array.isArray(l.areaIds)) l.areaIds = []; });
      });
      if (typeof startAllSharedMapListeners === 'function') startAllSharedMapListeners();
    }


    // Firebaseへの保存。
    // 複数操作が連続しても保存順序が逆転しないよう直列化する。
    function saveStorage(renderAfterSave = true) {
      const curMap = getCurrentMap();
      updateShareCodeStatus();

      try {
        if (curMap && !curMap.isShared) {
          sharedStoreDB[curMap.id] = {
            id: curMap.id, name: curMap.name,
            stores: JSON.parse(JSON.stringify(curMap.stores || [])),
            areas: JSON.parse(JSON.stringify(curMap.areas || [])),
            lists: JSON.parse(JSON.stringify(curMap.lists || [])),
            areaLists: JSON.parse(JSON.stringify(curMap.areaLists || []))
          };
          localStorage.setItem('gourmet_shared_maps', JSON.stringify(sharedStoreDB));
        }
      } catch (e) { console.warn('localStorage保存警告:', e); }

      if (currentUser.loggedIn && currentUser.uid) {
        const payload = {
          name: currentUser.name || 'ユーザー', email: currentUser.email || '',
          maps: JSON.parse(JSON.stringify(maps || [])), currentMapId: currentMapId || ''
        };
        cloudSaveInProgress = cloudSaveInProgress.catch(() => {}).then(() => writeUserDatabase(currentUser.uid, payload));

        if (curMap && !curMap.isShared && curMap.shareCode) {
          const code = curMap.shareCode;
          shareSyncInProgress = shareSyncInProgress.catch(() => {}).then(() => publishShareCode(curMap, code)).then(() => {
            updateShareCodeStatus(); return null;
          }).catch(e => {
            console.error('共有マップ自動同期失敗:', e); updateShareCodeStatus(); return null;
          });
        }

        cloudSaveInProgress.then(() => {
          users = JSON.parse(localStorage.getItem('gourmet_users')) || {};
          users[currentUser.uid] = payload;
          localStorage.setItem('gourmet_users', JSON.stringify(users));
          localStorage.setItem(`gourmet_user_maps_${currentUser.uid}`, JSON.stringify(maps));
          localStorage.setItem(`gourmet_user_map_id_${currentUser.uid}`, currentMapId);
        }).catch(() => {});
        if (renderAfterSave && typeof renderCurrentMap === 'function') renderCurrentMap();
        return Promise.all([cloudSaveInProgress, shareSyncInProgress]);
      }

      localStorage.setItem('gourmet_guest_maps', JSON.stringify(maps));
      localStorage.setItem('gourmet_guest_map_id', currentMapId);
      if (renderAfterSave && typeof renderCurrentMap === 'function') renderCurrentMap();
      return Promise.resolve();
    }

    function getCurrentMap() {
      return maps.find(m => m.id === currentMapId) || maps[0];
    }

    window.onload = async function() {
      await loadCurrentUserData();
      cloudDataReady = true;
      updateAuthUI();

      initializeMapAndInteractions();

      initSearchOptions();

    };

    function renderChoiceTags(prefix, options, selectedValues = []) {
      const selected = new Set(selectedValues || []);
      return options.map(v => `<button type="button" class="choice-tag ${selected.has(v) ? 'selected' : ''}" data-tag-prefix="${prefix}" data-value="${v}" onclick="toggleChoiceTag(this)">${v}</button>`).join('');
    }

    function toggleChoiceTag(el) { el.classList.toggle('selected'); }
    function getSelectedTagValues(prefix) { return Array.from(document.querySelectorAll(`.choice-tag[data-tag-prefix="${prefix}"].selected`)).map(el => el.dataset.value); }
    function renderCurrentMap() {

    /* 店舗登録モーダル */

    /* エリアピンの詳細情報 */


    function openMapSwitchModal() {
      toggleMenu();
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';

      const mapOptions = maps.map(m => `
        <option value="${m.id}" ${m.id === currentMapId ? 'selected' : ''}>${m.name}${m.isShared ? ' [共有]' : ''}</option>
      `).join('');

      const mapListItems = maps.map((m, index) => {
        const nameLen = String(m.name || '').length;
        const nameClass = nameLen >= 20 ? 'very-long' : (nameLen >= 12 ? 'long' : '');
        return `
        <li class="map-manage-row">
          <span class="map-manage-name ${nameClass}" title="${m.name}">🗺️ <b>${m.name}</b> ${m.id === currentMapId ? '<small style="color:var(--primary-color);">(選択中)</small>' : ''}</span>
          <div class="map-manage-actions">
            <button onclick="moveMapOrder(${index}, -1)" class="map-manage-btn">▲</button>
            <button onclick="moveMapOrder(${index}, 1)" class="map-manage-btn">▼</button>
            <button onclick="editMapName('${m.id}')" class="map-manage-btn" style="background:#ff9f43;">✏️ 編集</button>
            <button onclick="deleteMap('${m.id}')" class="map-manage-btn" style="background:#dc3545;">削除</button>
          </div>
        </li>`;
      }).join('');

      content.innerHTML = `
        <div class="modal-header"><h3>🗺️ マップの切替・編集</h3></div>
        <p style="font-size:11px; color:#666; margin-bottom:8px;">マップ登録上限数: ${maps.length}/30</p>
        
        <div class="form-group" style="margin-bottom:12px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
          <label>切り替えるマップを選択</label>
          <select id="switch-map-select" class="stylish-input scroll-select-10" size="10" onchange="switchCurrentMap(this.value)">
            ${mapOptions}
          </select>
        </div>

        <label style="font-weight:bold; font-size:11.5px;">マップ一覧・順序変更</label>
        <ul style="list-style:none; padding:0; max-height:40vh; overflow-y:auto; margin-top:4px;">
          ${mapListItems}
        </ul>
        <button onclick="closeModal()" class="btn-secondary" style="width:100%; margin-top:10px;">閉じる</button>
      `;
    }

    function switchCurrentMap(targetMapId) {
      if (!targetMapId || targetMapId === currentMapId) return;
      currentMapId = targetMapId;
      saveStorage();
      closeModal();
      closeDetailPanel();
      closeSearchResultsPanel();
    }

    function editMapName(mapId) {
      const targetMap = maps.find(m => m.id === mapId);
      if (!targetMap) return;
      const newName = prompt('マップ名を編集:', targetMap.name);
      if (newName && newName.trim()) {
        targetMap.name = newName.trim();
        saveStorage();
        openMapSwitchModal();
      }
    }

    function moveMapOrder(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= maps.length) return;
      const temp = maps[index];
      maps[index] = maps[targetIndex];
      maps[targetIndex] = temp;
      saveStorage();
      openMapSwitchModal();
    }

    function deleteMap(mapId) {
      const deleteTarget = maps.find(m => m.id === mapId);
      if (deleteTarget && deleteTarget.isShared) stopSharedMapListener(deleteTarget.id);
      if (maps.length <= 1) {
        alert('⚠️ マップは最低1つ必要なため削除できません。');
        return;
      }
      if (!confirm('このマップをリストから削除しますか？')) return;
      
      maps = maps.filter(m => m.id !== mapId);
      if (currentMapId === mapId) {
        currentMapId = maps[0].id;
      }
      saveStorage();
      openMapSwitchModal();
      closeDetailPanel();
    }

    function openNewMapModal() {
      toggleMenu();
      if (maps.length >= 30) {
        alert('⚠️ マップの登録上限数（30件）に達しています。');
        return;
      }
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';

      content.innerHTML = `
        <div class="modal-header"><h3>🗺️ 新規マップ作成</h3></div>
        <div class="form-group">
          <label>マップ名*</label>
          <input type="text" id="new-map-name" class="stylish-input" placeholder="例: 横浜グルメマップ">
        </div>
        <div class="btn-group">
          <button onclick="saveNewMap()">作成</button>
          <button onclick="closeModal()" class="btn-secondary">キャンセル</button>
        </div>
      `;
    }

    function saveNewMap() {
      const name = document.getElementById('new-map-name').value.trim();
      if (!name) {
        alert('マップ名を入力してください。');
        return;
      }
      if (maps.length >= 30) {
        alert('⚠️ マップの登録上限数（30件）に達しています。');
        return;
      }

      const newMap = createDefaultMap(null, name);
      maps.push(newMap);
      currentMapId = newMap.id;

      saveStorage();
      closeModal();
      closeDetailPanel();
      closeSearchResultsPanel();
      alert(`🎉 新しいマップ「${name}」を作成して切り替えました！`);
    }

  </script>
</body>
</html>
